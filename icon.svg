<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    A payment name is a bitcoin address you can say out loud, so the mark is a
    speech bubble with the bitcoin symbol knocked out of it.

    Drawn as one solid shape with the glyph removed rather than an outline on a
    background: an outlined mark silts up below about 40px, and the marketplace
    shows this at 24. Checked at 190, 64, 40 and 24 before it was committed.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f343d"/>
      <stop offset="100%" stop-color="#15171b"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#tile)"/>

  <path d="M76 40h104a40 40 0 0 1 40 40v56a40 40 0 0 1-40 40h-58l-40 34 6-34h-12a40 40 0 0 1-40-40V80a40 40 0 0 1 40-40z"
        fill="#f7931a"/>

  <g fill="none" stroke="#15171b" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M109 74v70"/>
    <path d="M109 74h24a17 17 0 0 1 0 34h-24"/>
    <path d="M109 108h28a17 17 0 0 1 0 34h-28"/>
    <path d="M125 62v12M147 62v12M125 142v12M147 142v12"/>
  </g>
</svg>
